[tool.poetry]
name = "codeownerinsights"
version = "0.1.0"
description = "Framework-agnostic helpers for parsing GitHub's CODEOWNERS file and resolving owners, with optional git integration."
authors = ["STealthy and haSTy <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "codeownerinsights" }]

[tool.poetry.dependencies]
python = "^3.8"
wcmatch = "^10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[tool.pytest.ini_options]
# the repo root holds the modules under test, which are not installed as a package
pythonpath = ["."]
testpaths = ["test"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"