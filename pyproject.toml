[project]
name = "codeownerinsights"
version = "0.1.0"
description = "Parse GitHub's CODEOWNERS file and resolve code owners for a path, with optional git integration."
authors = [{ name = "Keith Hall", email = "keith.hall@available.systems" }]
license = "MIT"
readme = "README-pypi.md"
requires-python = ">=3.8,<4.0"
keywords = ["codeowners", "git", "github", "code-review", "ownership"]
dependencies = ["wcmatch (>=10.0,<11.0)"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/STealthy-and-haSTy/CodeOwnerInsights"
Repository = "https://github.com/STealthy-and-haSTy/CodeOwnerInsights"
Issues = "https://github.com/STealthy-and-haSTy/CodeOwnerInsights/issues"

[tool.poetry]
packages = [{ include = "codeownerinsights" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[tool.pytest.ini_options]
# the repo root holds the modules under test, which are not installed as a package
pythonpath = ["."]
testpaths = ["test"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"